name = "signature-studio-pm"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# コードの既定は dry-run (経路ごとのスイッチが "1" でない限り GitHub へ書き込まない)。この toml は 2026-10-14 から live (VM の timer は停止中。README『切替の記録』)。
#   LIVE_LAUNCH   = launch の /oc コメント投稿
#   LIVE_DISPATCH = repository_dispatch (oc-watchdog と oc-pm) の送信
# 戻すときは該当のスイッチを "0" にして再デプロイする (VM の timer は再開しない)。
# 旧スイッチ LIVE ("1" で両方) は、LIVE_LAUNCH / LIVE_DISPATCH が未設定のときだけ効く。値は秘密ではない。
[vars]
REPO = "signature-studio/signature-studio-dev"
ORG = "signature-studio"
# 同時に走らせる opencode.yaml の run の総数の目標 (実装・review・fix・oc-pm・watchdog の全て。数え方は src/active.ts)。
# 同時実行の上限 60 (Team プラン) から 2 を残す (oc-pm・watchdog と、投稿直後でまだ run が現れていない分の余裕)。
TARGET = "58"
BATCH = "25"
BOT_LOGIN = "opencode-for-signature-studio[bot]"
PM_LOGINS = "pycabbage"
LIVE_LAUNCH = "1"
LIVE_DISPATCH = "1"
# oc:no-pr の再着手の間隔 (時間)。既定は 1 (config.ts の DEFAULT_NO_PR_COOLDOWN_H と同じ)。理由別の再着手 (#2334・#2650) の規則で、理由ごとの上限と計数を見る。
NO_PR_COOLDOWN_H = "1"
# prio:low の issue の未完了の run の上限 (既定 10。config.ts の DEFAULT_LOW_CAP と同じ)。prio:critical が着手済みか launch 可能な間だけ効く。実行中の run は止めない。
LOW_CAP = "10"
# 停止行 (run-outcome の reason が stop / split の issue) を oc-pm の判断キューへ 1 時間に送る件数の上限 (#5722。既定 24)。
# 値の根拠と測定は #5722 の PM 判断コメント。oc-pm の全体の枠 (PM_LIMITS.hourMax) の内で、厳しくするなら下げる。
STOPPED_INTAKE_PER_H = "24"
# コメントの全体同期は新しい順に 24 時間分を読む。窓内の件数は実測で既定の上限 (80 ページ = 8,000 件) を超える
# (tools/pm/REPORT_APPENDIX_2380.md) ので、そのままだと全体同期のたびに打ち切りになる。余裕を見て 150 ページ (15,000 件) にする。
COMMENT_MAX_PAGES = "150"

# この table が無いと wrangler deploy は Workers Logs を無効にする (#2585)。消さない。
[observability]
enabled = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "PM"
class_name = "PmDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PmDO"]

# tick ごとの観測を Custom Dashboard で時系列にする (CI-230)。写像と順序は README『Analytics Engine』表が正本。
[[analytics_engine_datasets]]
binding = "AE_METRICS"
dataset = "pm_metrics"

[triggers]
crons = ["* * * * *"]

# secret (wrangler secret put / API の secret_text): STORE_KEY = 32 バイトの base64url。リポジトリには置かない。
