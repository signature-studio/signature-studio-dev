name = "signature-studio-pm"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# 既定は dry-run (経路ごとのスイッチを "1" にしない限り GitHub へ書き込まない)。切替は PM の判断 (README)。
#   LIVE_LAUNCH   = launch の /oc コメント投稿
#   LIVE_DISPATCH = repository_dispatch (oc-watchdog と oc-pm) の送信
# 旧スイッチ LIVE ("1" で両方) は、LIVE_LAUNCH / LIVE_DISPATCH が未設定のときだけ効く。値は秘密ではない。
[vars]
REPO = "signature-studio/signature-studio-dev"
ORG = "signature-studio"
TARGET = "80"
BATCH = "25"
BOT_LOGIN = "opencode-for-signature-studio[bot]"
PM_LOGINS = "pycabbage"
LIVE_LAUNCH = "0"
LIVE_DISPATCH = "0"

[[durable_objects.bindings]]
name = "PM"
class_name = "PmDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PmDO"]

[triggers]
crons = ["* * * * *"]

# secret (wrangler secret put / API の secret_text): STORE_KEY = 32 バイトの base64url。リポジトリには置かない。
