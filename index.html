<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webstudio harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #eee;
        font-family: sans-serif;
      }
      #ui {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      button {
        font-size: 14px;
        padding: 8px 14px;
        cursor: pointer;
      }
      #status {
        font-size: 12px;
        opacity: 0.8;
      }
      #notices {
        position: fixed;
        right: 12px;
        bottom: 8px;
        z-index: 10;
        font-size: 11px;
        color: #eee;
        opacity: 0.6;
      }
      #screen {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <button id="start-audio" disabled>オーディオ開始</button>
      <span id="status">crossOriginIsolated: 確認中…</span>
    </div>
    <!-- FL の GUI 描画用フレームバッファ転送先 (全画面 Canvas) -->
    <canvas id="screen"></canvas>
    <a id="notices" href="/THIRD_PARTY_NOTICES.html" target="_blank" rel="license noopener">Third-party notices</a>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
