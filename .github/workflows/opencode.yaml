name: OpenCode

on:
  # Issues/PR に `/oc` または `/opencode` コマンドが投稿されたとき
  # `oc_actions_allow_write` を含む場合のみコンテンツ書き込み可
  issue_comment:
    types: [created]
  # PR が Open になったとき → レビュワーエージェントが起動
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: 'the task for the OpenCode agent'
        required: true

# 同一 PR/issue での並行実行は最新のみ
concurrency:
  group: opencode-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  implement:
    # 実装エージェント: issue_comment (/oc) または workflow_dispatch で起動。
    # PR 上の /oc コメントは conflict 解消などの追加作業。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')))
    runs-on: ubuntu-latest
    env:
      # workflow_dispatch は write 権限を持つ人手による起動なので書き込み可。
      # issue_comment は本文に oc_actions_allow_write を含む場合だけ書き込み可。
      OC_PERMISSION: >-
        ${{ (github.event_name == 'workflow_dispatch'
        || contains(github.event.comment.body, 'oc_actions_allow_write'))
        && 'write' || 'read' }}
    steps:
      # 実装 App トークン。read モードでは contents:read のみ要求する
      # (installation が write 権限を未 grant の環境でも read-only 検証が通るようにするため)
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.OC_APP_CLIENT_ID }}
          private-key: ${{ secrets.OC_APP_PRIVATE_KEY }}
          permission-contents: ${{ env.OC_PERMISSION }}
          permission-issues: ${{ env.OC_PERMISSION == 'write' && 'write' || 'read' }}
          permission-pull-requests: ${{ env.OC_PERMISSION == 'write' && 'write' || 'read' }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - if: ${{ env.OC_PERMISSION == 'write' }}
        id: setup-credentials
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          USER_ID=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email "${USER_ID}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Setup Agent Environment
        uses: ./.github/actions/agent-setup
        with:
          app-id: ${{ vars.OC_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.OC_APP_PRIVATE_KEY }}
          # read-only モードでは定期再発行トークンも読み取り専用に制限する
          token-permissions: ${{ env.OC_PERMISSION == 'read' && '{"contents":"read","issues":"read","pull-requests":"read"}' || '' }}
          cf-account-id: ${{ secrets.CF_ACCOUNT_ID }}
          cf-r2-access-key-id: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          cf-r2-secret-access-key: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}

      # イベント文脈を $GITHUB_ENV に書く (後続 step で参照できる)
      - name: Prepare event context
        id: context
        shell: bash
        run: |
          {
            echo "EVENT_NAME=${{ github.event_name }}"
            echo "PERMISSION=${{ env.OC_PERMISSION }}"
            echo "ISSUE_NUMBER=${{ github.event.issue.number || '' }}"
            echo "PR_NUMBER=${{ github.event.issue.number || github.event.pull_request.number || '' }}"
            echo "COMMENT_BODY<<OCCTXEOF"
            printf '%s' "${{ github.event.comment.body || github.event.inputs.prompt || '' }}" | head -c 20000
            echo ""
            echo "OCCTXEOF"
            echo "REPO=${{ github.repository }}"
            echo "GITHUB_REF_NAME=${GITHUB_REF_NAME}"
          } >> "$GITHUB_ENV"

      # $GITHUB_ENV の内容はこの step から見える (前行で書き出したもの)
      - name: Assemble prompt
        id: prompt
        shell: bash
        run: |
          bash .github/scripts/assemble-prompt.sh >> "$GITHUB_OUTPUT"

      - name: Run OpenCode (implementer)
        id: oc
        uses: ./.github/actions/opencode
        with:
          model: "opencode-go/step-5-preview-free"
          agent: build
          auth-export: ${{ secrets.OC_AUTH_EXPORT }}
          prompt: ${{ steps.prompt.outputs.prompt }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  review:
    # レビュワーエージェント: PR opened で起動。Approve/Deny し、
    # Auto Merge が使えない場合は Cognos がマージまで実行する。
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      # レビュワーは実装 App と別アイデンティティの方が approve できる
      # (同一 App は自分自身の PR を approve できない)。
      # OC_REVIEW_APP_CLIENT_ID / OC_REVIEW_APP_PRIVATE_KEY が未設定・失敗時は
      # 実装 App を使う (この場合 approve はできず comment+merge のみ)
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.OC_APP_CLIENT_ID }}
          private-key: ${{ secrets.OC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/create-github-app-token@v3
        id: reviewer-token
        continue-on-error: true
        if: ${{ vars.OC_REVIEW_APP_CLIENT_ID != '' && secrets.OC_REVIEW_APP_PRIVATE_KEY != '' }}
        with:
          client-id: ${{ vars.OC_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.OC_REVIEW_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Configure git
        env:
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token || steps.app-token.outputs.token }}
        run: |
          SLUG=${{ steps.app-token.outputs.app-slug }}
          USER_ID=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config --global user.name "${SLUG}[bot]"
          git config --global user.email "${USER_ID}+${SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Setup Agent Environment
        uses: ./.github/actions/agent-setup
        with:
          app-id: ${{ vars.OC_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.OC_APP_PRIVATE_KEY }}
          # create-github-app-token と同じ権限セットに制限する
          token-permissions: '{"contents":"write","pull-requests":"write"}'
          cf-account-id: ${{ secrets.CF_ACCOUNT_ID }}
          cf-r2-access-key-id: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          cf-r2-secret-access-key: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}

      - name: PR diff context
        id: diff
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} > "$RUNNER_TEMP/pr.diff" || true
          gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json title,body,isDraft --jq '.title' > "$RUNNER_TEMP/pr.title" || true
          echo "diff-lines=$(wc -l < "$RUNNER_TEMP/pr.diff")" >> $GITHUB_OUTPUT

      - name: Assemble reviewer prompt
        id: prompt
        shell: bash
        run: |
          DIFF_FILE="$RUNNER_TEMP/pr.diff"
          TITLE_FILE="$RUNNER_TEMP/pr.title"
          {
            echo "prompt<<OCEOF"
            cat .github/prompts/reviewer.md
            echo ""
            echo "## PR"
            echo "repo: ${{ github.repository }}"
            echo "number: ${{ github.event.pull_request.number }}"
            echo "title: $(cat "$TITLE_FILE" 2>/dev/null || echo '')"
            echo ""
            echo "## diff"
            echo '```diff'
            head -c 100000 "$DIFF_FILE" 2>/dev/null || echo "(diff unavailable)"
            echo '```'
            if [ -n "${{ steps.reviewer-token.outputs.token }}" ]; then
              echo "gh はレビュワー App identity で認証済み。approve / merge を実行できる。"
            else
              echo "NOTE: reviewer App identity unavailable; gh is authenticated as the implementer App. You cannot approve your own PR. Post the review as comment and merge directly if the project allows."
            fi
            echo "OCEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run OpenCode (reviewer)
        uses: ./.github/actions/opencode
        with:
          model: "opencode-go/step-5-preview-free"
          agent: build
          auth-export: ${{ secrets.OC_AUTH_EXPORT }}
          prompt: ${{ steps.prompt.outputs.prompt }}
        env:
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token || steps.app-token.outputs.token }}
