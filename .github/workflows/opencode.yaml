name: OpenCode

on:
  # Issues/PR に `/oc` または `/opencode` コマンドが投稿されたとき
  # `oc_actions_allow_write` を含む場合のみコンテンツ書き込み可
  issue_comment:
    types: [created]
  # PR が Open になったとき → レビュワーエージェントが起動
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: 'the task for the OpenCode'
        required: true
      allow_write:
        type: boolean
        description: 'whether to allow writing'
        required: false
        default: false
      token-mode:
        type: choice
        description: 'token source: app = GitHub App, gat = standard github.token'
        required: false
        default: app
        options: [app, gat]

# 同一 PR/issue での並行実行は最新のみ
concurrency:
  group: opencode-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  implement:
    # 実装エージェント: issue_comment (/oc) または workflow_dispatch で起動。
    # PR 上の /oc コメントは conflict 解消などの追加作業。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')))
    runs-on: ubuntu-latest
    env:
      OC_APP_ID: ${{ vars.OC_APP_CLIENT_ID }}
    outputs:
      pr-url: ${{ steps.make-pr.outputs.pr-url || steps.oc.outputs.pr-url }}
    steps:
      - name: Pre-judge step
        id: judge
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            if printf '%s' "${{ github.event.comment.body }}" | grep -q 'oc_actions_allow_write'; then
              echo "permission=write" >> $GITHUB_OUTPUT
            else
              echo "permission=read" >> $GITHUB_OUTPUT
            fi
          else
            if [ "${{ github.event.inputs.allow_write }}" = "true" ]; then
              echo "permission=write" >> $GITHUB_OUTPUT
            else
              echo "permission=read" >> $GITHUB_OUTPUT
            fi
          fi

      # 実装 App トークン (issue_comment が PR 上のコメントなら PR にも触る)
      # read モードでは contents:read のみ要求する (installation が write 権限を
      # 未grant の環境でも read-only 検証が通るようにするため)
      # token-mode=gat のときは標準 github.token を使用 (App 未設定時のフォールバック)
      - uses: actions/create-github-app-token@v3
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.token-mode != 'gat' }}
        id: app-token
        with:
          client-id: ${{ vars.OC_APP_CLIENT_ID }}
          private-key: ${{ secrets.OC_APP_PRIVATE_KEY }}
          permission-contents: ${{ steps.judge.outputs.permission }}
          permission-issues: ${{ steps.judge.outputs.permission == 'write' && 'write' || 'read' }}
          permission-pull-requests: ${{ steps.judge.outputs.permission == 'write' && 'write' || 'read' }}

      - name: Fallback to github.token
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.token-mode == 'gat' }}
        id: gat-token
        run: echo "token=${{ github.token }}" >> "$GITHUB_OUTPUT"

      - name: Resolve token
        id: tok
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.token-mode }}" = "gat" ]; then
            echo "token=${{ steps.gat-token.outputs.token }}" >> "$GITHUB_OUTPUT"
          else
            echo "token=${{ steps.app-token.outputs.token }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.tok.outputs.token }}
          fetch-depth: 0

      - if: ${{ steps.judge.outputs.permission == 'write' }}
        id: setup-credentials
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
        run: |
          USER_ID=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email "${USER_ID}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Setup Agent Environment
        uses: ./.github/actions/agent-setup
        with:
          artifacts: fl-win64
          app-private-key: ${{ secrets.OC_APP_PRIVATE_KEY }}
          cf-account-id: ${{ secrets.CF_ACCOUNT_ID }}
          cf-r2-access-key-id: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          cf-r2-secret-access-key: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}

      - name: Assemble prompt
        id: prompt
        shell: bash
        run: |
          # イベント文脈を環境変数化 → テンプレートに流し込む
          {
            echo "EVENT_NAME=${{ github.event_name }}"
            echo "PERMISSION=${{ steps.judge.outputs.permission }}"
            echo "ISSUE_NUMBER=${{ github.event.issue.number || '' }}"
            echo "PR_NUMBER=${{ github.event.issue.number || github.event.pull_request.number || '' }}"
            echo "COMMENT_BODY<<EOF"
            printf '%s' "${{ github.event.comment.body || github.event.inputs.prompt || '' }}" | head -c 20000
            echo ""
            echo "EOF"
            echo "REPO=${{ github.repository }}"
            echo "GITHUB_REF_NAME=${GITHUB_REF_NAME}"
          } >> "$GITHUB_ENV"
          bash .github/scripts/assemble-prompt.sh >> "$GITHUB_OUTPUT"

      - name: Run OpenCode (implementer)
        id: oc
        uses: ./.github/actions/opencode
        with:
          model: "opencode-go/step-5-preview-free"
          agent: build
          auth-export: ${{ secrets.OC_AUTH_EXPORT }}
          prompt: ${{ steps.prompt.outputs.prompt }}

  review:
    # レビュワーエージェント: PR opened で起動。Approve/Deny し、
    # Auto Merge が使えない場合は Cognos がマージまで実行する。
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      # レビュワーは実装 App と別アイデンティティの方が approve できる
      # (同一 App は自分自身の PR を approve できない)。
      # OC_REVIEW_APP_CLIENT_ID / OC_REVIEW_APP_PRIVATE_KEY が未設定の場合は
      # 実装 App を使う (この場合 approve はできず、コメント+マージ試行のみ)
      - name: Detect reviewer credentials
        id: creds
        run: |
          if [ -n "${{ vars.OC_REVIEW_APP_CLIENT_ID }}" ] && [ -n "${{ secrets.OC_REVIEW_APP_PRIVATE_KEY }}" ]; then
            echo "use-reviewer=true" >> $GITHUB_OUTPUT
          else
            echo "use-reviewer=false" >> $GITHUB_OUTPUT
          fi

      # レビュワー App が未インストール/失敗した場合は実装 App にフォールバック
      # (その場合 approve はできず comment+merge のみ)
      - name: Reviewer token fallback
        id: reviewer-tok
        run: |
          if [ "${{ steps.creds.outputs.use-reviewer }}" = "true" ] && [ "${{ steps.reviewer-token.outputs.token != '' }}" ]; then
            echo "token=${{ steps.reviewer-token.outputs.token }}" >> "$GITHUB_OUTPUT"
            echo "identity=reviewer" >> "$GITHUB_OUTPUT"
          else
            echo "token=${{ steps.app-token.outputs.token }}" >> "$GITHUB_OUTPUT"
            echo "identity=implementer" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.OC_APP_CLIENT_ID }}
          private-key: ${{ secrets.OC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/create-github-app-token@v3
        id: reviewer-token
        continue-on-error: true
        if: ${{ steps.creds.outputs.use-reviewer == 'true' }}
        with:
          client-id: ${{ vars.OC_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.OC_REVIEW_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Configure git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          SLUG=${{ steps.app-token.outputs.app-slug }}
          USER_ID=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config --global user.name "${SLUG}[bot]"
          git config --global user.email "${USER_ID}+${SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Setup Agent Environment
        uses: ./.github/actions/agent-setup
        with:
          artifacts: fl-win64
          app-private-key: ${{ secrets.OC_APP_PRIVATE_KEY }}
          cf-account-id: ${{ secrets.CF_ACCOUNT_ID }}
          cf-r2-access-key-id: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          cf-r2-secret-access-key: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}

      - name: "PR diff context"
        id: diff
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} > "$RUNNER_TEMP/pr.diff" || true
          gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json title,body,isDraft --jq '.title' > "$RUNNER_TEMP/pr.title" || true
          echo "diff-lines=$(wc -l < "$RUNNER_TEMP/pr.diff")" >> $GITHUB_OUTPUT

      - name: Run OpenCode (reviewer)
        uses: ./.github/actions/opencode
        with:
          model: "opencode-go/step-5-preview-free"
          agent: build
          auth-export: ${{ secrets.OC_AUTH_EXPORT }}
          prompt: ${{ steps.prompt.outputs.prompt }}

      - name: Assemble reviewer prompt
        id: prompt
        shell: bash
        run: |
          DIFF_FILE="$RUNNER_TEMP/pr.diff"
          TITLE_FILE="$RUNNER_TEMP/pr.title"
          {
            echo "prompt<<OCEOF"
            cat .github/prompts/reviewer.md
            echo ""
            echo "## PR"
            echo "repo: ${{ github.repository }}"
            echo "number: ${{ github.event.pull_request.number }}"
            echo "title: $(cat "$TITLE_FILE" 2>/dev/null || echo '')"
            echo ""
            echo "## diff"
            echo '```diff'
            head -c 100000 "$DIFF_FILE" 2>/dev/null || echo "(diff unavailable)"
            echo '```'
            if [ "${{ steps.reviewer-tok.outputs.identity }}" = "reviewer" ]; then
              echo "REVIEWER_TOKEN=${{ steps.reviewer-tok.outputs.token }}"
            else
              echo "NOTE: reviewer App identity unavailable; you cannot approve your own PR. Post the review as comment and merge directly if the project allows."
            fi
            echo "OCEOF"
          } >> "$GITHUB_OUTPUT"
