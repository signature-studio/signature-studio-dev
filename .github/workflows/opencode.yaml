name: OpenCode

# repository_dispatch (oc-fix) の run は『oc-fix #<PR 番号>』と名づける。watchdog が実行中の run と PR を突き合わせるため。
# repository_dispatch (oc-pm) の run は『oc-pm <kind> #<ref>』。launch_issues.py の active_runs は題名が oc-fix で始まる
# repository_dispatch だけを実装の稼働数に数えるので、この題名の run は数えない (PM agent は実装枠を使わない。#2330)。
# repository_dispatch (oc-watchdog) の run は『watchdog』。他のイベントでは空文字になり、既定の名前 (PR タイトル等) のまま。
run-name: "${{ github.event_name == 'repository_dispatch' && (github.event.action == 'oc-fix' && format('oc-fix #{0}', github.event.client_payload.pr) || github.event.action == 'oc-pm' && format('oc-pm {0} #{1}', github.event.client_payload.kind, github.event.client_payload.ref) || 'watchdog') || '' }}"

on:
  # Issues/PR に `/oc` または `/opencode` コマンドが投稿されたとき。
  # 本文に `oc_actions_allow_write` を含む場合のみコンテンツ書き込み可。
  # 実行可否の確定判定は prepare-event-context.sh (行頭アンカーの正規表現)。
  issue_comment:
    types: [created]
  # PR が Open / 更新 / 再オープンされたとき → レビュワーエージェントが起動
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # review の提出で fix モードが動く (指示 122/123: open PR は「レビュー中」か「レビューを受けて修正中」
  # のどちらかであり、人手 (PM) を介さずに遷移する)。
  #   oc-reviewer が changes_requested  -> implement job が fix モードで同じ PR ブランチを修正して push
  #                                        (push が synchronize を起こし、review job が再起動する)
  # Copilot の review 提出では何も起動しない (Copilot 待ちの保留は廃止した)。
  pull_request_review:
    types: [submitted]
  # 競合している PR には pull_request / pull_request_review のいずれも起動しない (merge commit が作れない)。
  # watchdog が repository_dispatch (type oc-fix) を送って、競合の解消を fix モードの実装 run に載せる (#731)。
  # 送れるのは contents:write を持つトークンだけ。payload は PR 番号・理由・素材名のみで、
  # prepare-event-context.sh が値域を検証する。
  #   type oc-watchdog は watchdog job を起こす (GitHub の cron は遅延・欠落するため、VM の timer から周期的に送る。#749)。
  #   type oc-pm は pm job (PM agent) を起こす。payload は kind (列挙 9 値) と ref (数字) だけで、値域は
  #   prepare-event-context.sh が検証する (#2327)。送り手は watchdog.sh か PM Worker (contents:write を持つトークン)。
  repository_dispatch:
    types: [oc-fix, oc-watchdog, oc-pm]
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: 'the task for the OpenCode agent'
        required: true
      opencode-version:
        type: string
        description: 'pin the opencode CLI version for the npm channel (empty = the default in scripts/install-opencode.sh)'
        required: false
        default: ''
      opencode-release-version:
        type: string
        description: 'pin the opencode release tag for the GitHub Releases channel (empty = the default)'
        required: false
        default: ''
      opencode-install-source:
        type: string
        description: 'auto | releases | npm'
        required: false
        default: ''
  # main が進むと、既に open の PR が競合になる。競合 PR には pull_request / pull_request_review の event が
  # 起きず、review も修正も始まらないので、main への push のたびに全 open PR を点検する (watchdog job)。
  # 競合 PR は watchdog が repository_dispatch (oc-fix) で fix モードの実装 run に載せる。
  push:
    branches: [main]
  # event の取りこぼしや run の失敗で「レビューも修正もされていない」PR が残らないよう、定期的に点検する。
  schedule:
    - cron: '*/5 * * * *'

# すべての GitHub API 認証は
# actions/create-github-app-token が発行する App installation token が担う。
# したがって GITHUB_TOKEN の権限は最小のまま (job 単位で拡大しない)。
permissions: {}

# 同一 PR/issue での並行実行の直列化は、workflow ではなく **job** に置く (concurrency は
# 各 job 内)。workflow 単位だと、agent 自身の `gh issue comment` が起こす issue_comment run
# (job の if で skipped になる) まで同じグループに入り、実装 run の実行中は pending になって
# 次の bot コメントで cancelled される。待機中の /oc 依頼が黙って押し出される恐れがある (#434)。
# job 単位なら、if で弾かれる job はグループに入らない。cancel-in-progress は false:
# 実行中のエージェントを push で中断すると作業内容が失われる。

jobs:
  watchdog:
    # open PR を「レビュー中」か「レビューを受けて修正中」のどちらかに保つ (#719、指示 122/123)。
    # 主経路はイベント駆動 (差し戻し -> fix、push -> review)。これはバックストップで、イベントが起きない
    # 競合と、取りこぼし・失敗した run を点検して戻す。詳細は .github/scripts/watchdog.sh の冒頭。
    # review の提出・merge・ready・close/reopen は reviewer App 名義で行う (同一 App は自分が作った
    # PR に request-changes できない)。
    if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'repository_dispatch' && github.event.action == 'oc-watchdog')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GITHUB_TOKEN は実行中の run の一覧 (actions:read) にだけ使う。他の権限は付けない。
    permissions:
      actions: read
    concurrency:
      group: opencode-watchdog
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/create-github-app-token@v3
        id: reviewer-token
        with:
          client-id: ${{ vars.OC_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.OC_REVIEW_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Keep every open PR either under review or being fixed
        shell: bash
        env:
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token }}
          RUNS_TOKEN: ${{ github.token }}
          OC_REPO: ${{ github.repository }}
        run: bash .github/scripts/watchdog.sh

  # fix モード (reviewer の差し戻し・oc-fix) の窓の判定と印の投稿 (#2873)。agent のコードを実行しない job。
  # base の checkout の scripts だけを動かし、PR の head は checkout しない。GITHUB_TOKEN は pull-requests: write だけ。
  # 窓の印 (oc-fix-limit / oc-fix-reset) と oc:stuck は、この job の GITHUB_TOKEN で付ける (#2622・#2638)。
  # implement は needs で結果 (stop) だけを受け取る。fixgate が失敗・cancel されたら implement は走らない (fail-closed)。
  fixgate:
    if: >-
      (github.event_name == 'pull_request_review' &&
      github.event.review.state == 'changes_requested' &&
      github.event.review.user.type == 'Bot' &&
      github.event.review.user.login == 'oc-reviewer-for-signature-studio[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'oc-fix')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: opencode-fixgate-${{ github.event.pull_request.number || github.event.client_payload.pr || github.ref }}
      cancel-in-progress: false
    permissions:
      pull-requests: write
    outputs:
      stop: ${{ steps.gate.outputs.stop }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      # base の ref だけを checkout する (pull_request_review は base.ref、repository_dispatch は既定の branch)。
      # PR の head は checkout しない。認証情報は残さない。
      - name: Checkout repository (base only)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_review' && github.event.pull_request.base.ref || '' }}
          persist-credentials: false

      # should_run の判定は implement と同じ script を使う (不正な dispatch で窓の印を付けないため)。
      - name: Prepare event context
        id: context
        shell: bash
        env:
          OC_PERMISSION: write
        run: bash .github/scripts/prepare-event-context.sh

      - name: Window gate (fix-progress gate)
        id: gate
        if: steps.context.outputs.should_run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OC_MARK_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fix-progress.sh gate

  implement:
    # 実装エージェント: issue_comment (/oc) または workflow_dispatch で起動。
    # PR 上の /oc コメントは conflict 解消などの追加作業。
    #
    # この if: は費用対効果のための粗い前フィルタにすぎない。contains() は部分一致
    # なので `/ocean` にも発火しうる。確定判定は prepare-event-context.sh の
    # should_run output で、それ以降の全 step をゲートする。
    #
    # public repo では第三者も Issue にコメントできるため、/oc コメントでの
    # 起動は author_association COLLABORATOR/MEMBER/OWNER に限定する。
    # 本文の oc_actions_allow_write 経由で第三者が write モードを起動する
    # 経路を閉じる。
    # 例外として、PM 用 GitHub App (repo 変数 OC_PM_BOT_LOGIN のログイン名。例
    # oc-pm-for-signature-studio[bot]) が投稿した /oc も通す (#1949)。偽装できない理由:
    # App のログイン (`<slug>[bot]`) は GitHub が App に付与し、第三者は同じログインの
    # コメントを作れない (`[bot]` 付きのログインは通常のユーザー名に使えない)。user.type が
    # 'Bot' であることも併せて見る。変数が未設定 (空) のときは `!= ''` で偽になり、何も許可しない。
    # prepare-event-context.sh が同じ判定を二重に行う (そちらが確定判定)。
    if: >-
      !cancelled() &&
      (needs.fixgate.result == 'success' || needs.fixgate.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
      (github.event.comment.author_association == 'COLLABORATOR' ||
      github.event.comment.author_association == 'MEMBER' ||
      github.event.comment.author_association == 'OWNER' ||
      (vars.OC_PM_BOT_LOGIN != '' &&
      github.event.comment.user.type == 'Bot' &&
      github.event.comment.user.login == vars.OC_PM_BOT_LOGIN)) &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))) ||
      (github.event_name == 'pull_request_review' &&
      github.event.review.state == 'changes_requested' &&
      github.event.review.user.type == 'Bot' &&
      github.event.review.user.login == 'oc-reviewer-for-signature-studio[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'oc-fix'))
    needs: fixgate
    runs-on: ubuntu-latest
    concurrency:
      group: opencode-impl-${{ github.event.pull_request.number || github.event.issue.number || github.event.client_payload.pr || github.ref }}
      cancel-in-progress: false
    # opencode が暴走しても runner を既定の 6 時間は占有しない
    timeout-minutes: 60
    # GITHUB_TOKEN は fix-progress.sh record が窓の印 (oc-fix-limit / oc-fix-reset) を PR に投稿するためだけに使う (#2622)。
    # 実装 App 名義の印は agent が偽造できる。issues: write だけでは PR へのコメントが 403 になる (#2638 で実測)。
    # agent の step には渡さない (agent の GH_TOKEN は実装 App のみ)。他の権限は付けない。
    permissions:
      pull-requests: write
    env:
      # workflow_dispatch は write 権限を持つ人手による起動なので書き込み可。
      # issue_comment は本文に oc_actions_allow_write を含む場合だけ書き込み可。
      # pull_request_review (oc-reviewer の差し戻し。上の if で投稿者を限定済み) は fix のため write。
      # 式評価であり untrusted 文字列を shell に展開していないので injection はない。
      # 値域の検証は prepare-event-context.sh が行う。
      OC_PERMISSION: >-
        ${{ (github.event_name == 'workflow_dispatch'
        || github.event_name == 'pull_request_review'
        || github.event_name == 'repository_dispatch'
        || contains(github.event.comment.body, 'oc_actions_allow_write'))
        && 'write' || 'read' }}
    steps:
      # ---------------------------------------------------------------------
      # 1. Checkout — prepare-event-context.sh は $GITHUB_EVENT_PATH を読むだけで
      #    リポジトリ内容を必要としないため、Checkout を前に置いても安全。
      #    これにより準備ステップが .github/scripts/ 以下のファイルにアクセス可能。
      #    should_run 依存ではなく無条件で実行する。
      # ---------------------------------------------------------------------
      # pull_request_review の GITHUB_SHA は refs/pull/N/merge なので、ref 未指定だと PR 側の
      # .github/actions と .github/scripts が secrets 付きで実行される。fix モードでは base
      # (main の正本) を checkout し、agent が `gh pr checkout` で PR ブランチへ移る。
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request_review' && github.event.pull_request.base.ref || '' }}
          persist-credentials: false

      # 無音終了の検知 (implement-progress.sh) の基準時刻。script は checkout で得るので、checkout の直後に取る。
      # agent-setup (2.3GB の展開を含む) より前なので、job の残り時間の見積もりに展開の時間が入る。
      - name: Mark the job start (implement progress)
        id: jobstart
        shell: bash
        run: bash .github/scripts/implement-progress.sh mark >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # 2. untrusted input の隔離 (script injection / env injection の防止)。
      #    最も安価なステップなので最初に置き、コマンド判定を外れたコメントでは
      #    App トークン発行にも到達しない。untrusted 値は式展開で shell に埋め込まず
      #    $GITHUB_EVENT_PATH 経由で受け取る。
      # ---------------------------------------------------------------------
      - name: Prepare event context
        id: context
        shell: bash
        env:
          OC_PM_BOT_LOGIN: ${{ vars.OC_PM_BOT_LOGIN }}
        run: bash .github/scripts/prepare-event-context.sh

      - name: No agent command in this comment
        if: steps.context.outputs.should_run != 'true'
        shell: bash
        run: echo "::notice::the agent was not started (no /oc or /opencode command on its own line, or the commenter is not allowed)"

      # 実装 App トークン。read モードでは contents:read のみ要求する
      # (installation が write 権限を未 grant の環境でも read-only 検証が通るため)
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: steps.context.outputs.should_run == 'true'
        with:
          client-id: ${{ vars.OC_APP_CLIENT_ID }}
          private-key: ${{ secrets.OC_APP_PRIVATE_KEY }}
          permission-contents: ${{ env.OC_PERMISSION }}
          permission-issues: ${{ env.OC_PERMISSION == 'write' && 'write' || 'read' }}
          permission-pull-requests: ${{ env.OC_PERMISSION == 'write' && 'write' || 'read' }}

      # persist-credentials: false — checkout の既定はローカルの extraheader に
      # 永続 token を書き込む方式で、App トークンとは別の認証経路になる
      # (credential helper より優先され、後で token を入れ替えても反映されない)。
      # 認証は「App トークンを明示的に渡す」経路だけに統一する。
      #
      # 注: この step 以降に現れる ${{ steps.app-token.outputs.* }} の式展開は
      # with: / env: 経由だけ。run スクリプト中には 1 箇所も展開していない
      # (展開しても shell には文字列として入るだけで、untrusted なイベント値を
      # 経由しないので script injection にはならない)。
      - if: steps.context.outputs.should_run == 'true' && env.OC_PERMISSION == 'write'
        id: setup-credentials
        shell: bash
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Setup Agent Environment
        if: steps.context.outputs.should_run == 'true'
        uses: ./.github/actions/agent-setup
        with:
          # dispatch 入力 > repository variable > スクリプト既定の pin
          opencode-version: ${{ inputs.opencode-version || vars.OPENCODE_VERSION }}
          opencode-release-version: ${{ inputs.opencode-release-version || vars.OPENCODE_RELEASE_VERSION }}
          opencode-install-source: ${{ inputs.opencode-install-source || vars.OPENCODE_INSTALL_SOURCE }}
          # 本文の `oc_artifacts:` 行 (allowlist 検証済み)。空なら既定の fl-win64
          artifacts: ${{ steps.context.outputs.artifacts || 'fl-win64' }}
          cf-account-id: ${{ secrets.CF_ACCOUNT_ID }}
          cf-r2-access-key-id: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          cf-r2-secret-access-key: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}

      # プロンプトはファイルに組み立て、step output にはパスの 1 行だけを載せる。
      # heredoc で $GITHUB_OUTPUT に流すと delimiter injection の余地があるため。
      - name: Assemble prompt
        id: prompt
        if: steps.context.outputs.should_run == 'true'
        shell: bash
        run: bash .github/scripts/assemble-prompt.sh

      # fix モード (reviewer の差し戻し) の進捗検証用に、起動時点の PR head を記録する。
      # OC_MARK_TOKEN (job の GITHUB_TOKEN) はこの step の env だけに渡す。agent の step には渡さない (#2622)。
      - name: Record the PR head (fix mode)
        id: fixrec
        if: steps.context.outputs.should_run == 'true' && contains(fromJSON('["pull_request_review","repository_dispatch"]'), github.event_name)
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OC_MARK_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fix-progress.sh record

      # fix モードは step に上限を置く: job の 60 分を使い切ると、下の検証・再試行 step が走る前に
      # job ごと打ち切られ、無音終了になるため。
      # 無音終了 (issue 上の /oc run が PR も push もコメントも残さずに終わる) の検知と、job 内の 1 回だけの再試行 (#5727 受入 6)。
      # fix モードは下の fix-progress.sh の再試行が既にあるので対象外。
      - name: Record the HEAD before the implementer (implement progress)
        id: implsha
        if: steps.context.outputs.should_run == 'true' && !contains(fromJSON('["pull_request_review","repository_dispatch"]'), github.event_name)
        shell: bash
        run: bash .github/scripts/implement-progress.sh sha >> "$GITHUB_OUTPUT"

      - name: Run OpenCode (implementer)
        id: oc
        if: steps.context.outputs.should_run == 'true' && steps.fixrec.outputs.stop != 'true' && needs.fixgate.outputs.stop != 'true'
        timeout-minutes: ${{ contains(fromJSON('["pull_request_review","repository_dispatch"]'), github.event_name) && 40 || 58 }}
        uses: ./.github/actions/opencode
        with:
          model: ${{ vars.OC_MODEL_ID }}
          agent: build
          auth-export: ${{ secrets.OC_AUTH_EXPORT }}
          prompt-file: ${{ steps.prompt.outputs.prompt_file }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # issue の /oc run (implement) が何も残さずに終わったら、同じ job の中で 1 回だけ再試行する。
      # 再試行は作業ツリーが clean で HEAD が開始時のままで、job の残り時間 (60 分の上限) に余裕があるときだけ。
      # 再試行もなお無音なら job を失敗させる (record-run-outcome.sh の報告は always() で別に残る)。
      - name: Check the implement progress
        id: implprog
        if: ${{ !cancelled() && steps.context.outputs.should_run == 'true' && github.event_name == 'issue_comment' && steps.implsha.outcome == 'success' && steps.implsha.outputs.start_sha != '' && needs.fixgate.outputs.stop != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OC_REPO: ${{ github.repository }}
          OC_START_ISO: ${{ steps.jobstart.outputs.start_iso }}
          OC_START_SHA: ${{ steps.implsha.outputs.start_sha }}
          OC_JOB_START_EPOCH: ${{ steps.jobstart.outputs.start_epoch }}
        run: bash .github/scripts/implement-progress.sh check >> "$GITHUB_OUTPUT"

      - name: Prepare the implement retry prompt
        id: implretry-prompt
        if: ${{ !cancelled() && steps.implprog.outputs.retry == 'true' }}
        shell: bash
        env:
          OC_PROMPT_SRC: ${{ steps.prompt.outputs.prompt_file }}
        run: bash .github/scripts/implement-progress.sh retry-prompt >> "$GITHUB_OUTPUT"

      - name: Run OpenCode (implement run, retry)
        id: oc-implretry
        if: ${{ !cancelled() && steps.implprog.outputs.retry == 'true' }}
        timeout-minutes: 15
        uses: ./.github/actions/opencode
        with:
          model: ${{ vars.OC_MODEL_ID }}
          agent: build
          auth-export: ${{ secrets.OC_AUTH_EXPORT }}
          prompt-file: ${{ steps.implretry-prompt.outputs.prompt_file }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Check the implement progress (retry)
        id: implprog-retry
        if: ${{ !cancelled() && steps.implprog.outputs.retry == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OC_REPO: ${{ github.repository }}
          OC_START_ISO: ${{ steps.jobstart.outputs.start_iso }}
          OC_START_SHA: ${{ steps.implsha.outputs.start_sha }}
          OC_JOB_START_EPOCH: ${{ steps.jobstart.outputs.start_epoch }}
        run: bash .github/scripts/implement-progress.sh check >> "$GITHUB_OUTPUT"

      - name: Fail when the implement run made no progress
        if: ${{ !cancelled() && steps.implprog.outputs.result == 'none' && steps.implprog-retry.outputs.result != 'done' }}
        shell: bash
        run: |
          echo "::error::the implement run neither pushed, opened a PR, nor commented on the issue (reason: ${{ steps.implprog-retry.outputs.reason || steps.implprog.outputs.reason }}), even after one retry"
          exit 1

      # ---------------------------------------------------------------------
      # fix モードの「無音終了」対策。差し戻された PR は、agent が push も PR コメントもせずに
      # 終わると「修正もレビューもされていない」状態に戻ってしまう。
      #   pushed   -> synchronize が review を起動する
      #   answered -> push せず根拠をコメントした。review を起動し直す (下の reopen)
      #   none     -> 何もしていない。1 回だけ再試行し、なお none なら job を失敗させる
      # ---------------------------------------------------------------------
      # `always()` ではなく `!cancelled()`: always() は run の cancel 後も走るため、PM が fix run を cancel しても
      # retry (write、15 分) が起動して push しうる。!cancelled() は失敗・step の timeout の後には走り、cancel の後には走らない。
      - name: Check the fix progress
        id: progress
        if: ${{ !cancelled() && steps.context.outputs.should_run == 'true' && contains(fromJSON('["pull_request_review","repository_dispatch"]'), github.event_name) && steps.fixrec.outcome == 'success' && steps.fixrec.outputs.stop != 'true' && needs.fixgate.outputs.stop != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash .github/scripts/fix-progress.sh check

      - name: Prepare the retry prompt
        id: retry-prompt
        if: ${{ !cancelled() && steps.fixrec.outcome == 'success' && steps.fixrec.outputs.stop != 'true' && steps.progress.outputs.result == 'none' }}
        shell: bash
        env:
          OC_PROMPT_SRC: ${{ steps.prompt.outputs.prompt_file }}
        run: bash .github/scripts/fix-progress.sh retry-prompt

      - name: Run OpenCode (implementer, retry)
        id: oc-retry
        if: ${{ !cancelled() && steps.fixrec.outcome == 'success' && steps.fixrec.outputs.stop != 'true' && steps.progress.outputs.result == 'none' }}
        timeout-minutes: 15
        uses: ./.github/actions/opencode
        with:
          model: ${{ vars.OC_MODEL_ID }}
          agent: build
          auth-export: ${{ secrets.OC_AUTH_EXPORT }}
          prompt-file: ${{ steps.retry-prompt.outputs.prompt_file }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Check the fix progress (retry)
        id: progress-retry
        if: ${{ !cancelled() && steps.fixrec.outcome == 'success' && steps.fixrec.outputs.stop != 'true' && steps.progress.outputs.result == 'none' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash .github/scripts/fix-progress.sh check

      # push せず根拠だけをコメントして終えた場合、コメントは review を起動しないので
      # close -> reopen で pull_request:reopened を起こし、reviewer に再判断させる。
      - name: Re-trigger the review after an answer without a push
        if: ${{ !cancelled() && (steps.progress.outputs.result == 'answered' || steps.progress-retry.outputs.result == 'answered') }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash .github/scripts/fix-progress.sh reopen

      - name: Fail when the fix run made no progress
        if: ${{ !cancelled() && steps.progress-retry.outputs.result == 'none' }}
        shell: bash
        run: |
          echo "::error::the fix run neither pushed a commit nor commented on the PR, even after one retry"
          exit 1

      # ---------------------------------------------------------------------
      # 終了時の不変条件 (#1950): issue は常に『blocked』『着手済み』『closed』のいずれか。
      # issue の /oc run が PR も push も出さずに (成功・失敗・cancel のいずれでも) 終わったとき、issue に
      # ラベル oc:no-pr と構造化コメント (<!-- oc-run-outcome: no-pr reason=... run=... -->) を残し、PM Worker が
      # コメント本文を解析せずに扱えるようにする。PR がある・明示的な終了状態 (oc:stuck / needs-user-input / blocked)
      # なら何もしない (oc:no-pr は外す)。観測用で、この step は job を失敗させない。
      # always(): agent の失敗・cancel の後でも走らせる。App token は発行済みのときだけ使える (無ければ何もしない)。
      # ---------------------------------------------------------------------
      - name: Record the run outcome (issue without a PR)
        if: ${{ always() && steps.context.outputs.should_run == 'true' && env.OC_PERMISSION == 'write' && github.event_name == 'issue_comment' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OC_JOB_STATUS: ${{ job.status }}
        run: bash .github/scripts/record-run-outcome.sh

      # ---------------------------------------------------------------------
      # pr-lint.sh (CI-43): agent が出した (直した) PR を、差し戻しの上位原因 (REPORT 行数・repo 外パス・Closes/Refs と
      # 受入の整合・oc_artifacts の値域・DOC_MAP 登録) で決定的に検査し、結果を step summary に書く。
      # PR は agent の step の中で作られる (workflow に PR 作成 step は無い) ので、agent の step が全て終わった後に、
      # その PR を探して検査する。agent 自身も PR を出す前に同じ検査を走らせる (prompt)。
      # job の最後 (Record the run outcome より後) に置く: job の上限 (60 分) に当たったとき、#1950 の不変条件を守る Record
      # (always()) が lint に時間を取られて走らないことが無いように。lint は !cancelled() なので、上限での打ち切りの後には走らない。
      # 既定は警告のみ: continue-on-error で job を落とさず、OC_LINT_STRICT は repo 変数 (未設定なら警告のまま)。
      # script は origin/main の版を取り出して使う (agent が作業ツリーを PR ブランチに移していても、PR 側のコードを実行しない)。
      # 検査する PR: fix モード (pull_request_review / repository_dispatch oc-fix) と PR 上の /oc は OC_PR_NUMBER、
      # issue 上の /oc はその issue を指す open PR (ブランチ名 <N>-... か本文の Closes/Refs/Fixes/Resolves #N。record-run-outcome.sh と同じ判定)。
      # workflow_dispatch と、PR が無い run は何もしない。
      # ---------------------------------------------------------------------
      - name: Lint the PR (pr-lint.sh)
        id: pr-lint
        if: ${{ !cancelled() && steps.context.outputs.should_run == 'true' && env.OC_PERMISSION == 'write' && steps.fixrec.outputs.stop != 'true' && needs.fixgate.outputs.stop != 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OC_LINT_STRICT: ${{ vars.OC_LINT_STRICT }}
        run: |
          set -uo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::notice::no token: pr-lint is skipped"; exit 0; }
          prs=""
          case "$OC_EVENT_NAME" in
            pull_request_review) prs="$OC_PR_NUMBER" ;;
            repository_dispatch)
              [ "$(jq -r '.action // ""' "$GITHUB_EVENT_PATH")" = oc-fix ] && prs="$OC_PR_NUMBER" ;;
            issue_comment)
              if [ -n "$(jq -r '.issue.pull_request // empty' "$GITHUB_EVENT_PATH")" ]; then
                prs="$OC_PR_NUMBER"
              else
                case "$OC_ISSUE_NUMBER" in
                  '' | *[!0-9]*) ;;
                  *)
                    prs="$(gh api --paginate "repos/$OC_REPO/pulls?state=open&per_page=100" \
                      | jq -rs --argjson n "$OC_ISSUE_NUMBER" '[.[][] | select(((.head.ref // "") | test("^" + ($n | tostring) + "-")) or ((.body // "") | test("(Closes|Refs|Fixes|Resolves) #" + ($n | tostring) + "([^0-9]|$)"; "i"))) | .number] | .[0:3] | join(" ")')" \
                      || prs=""
                    ;;
                esac
              fi ;;
          esac
          case "$prs" in *[!0-9\ ]*) echo "::warning::unexpected PR list: pr-lint is skipped"; exit 0 ;; esac
          [ -n "$prs" ] || { echo "::notice::no PR to lint (event=$OC_EVENT_NAME)"; exit 0; }
          trusted="$RUNNER_TEMP/oc-lint-scripts"
          rm -rf "$trusted" && mkdir -p "$trusted"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' \
            || { echo "::warning::could not fetch main for pr-lint"; exit 1; }
          git archive origin/main .github/scripts/pr-lint.sh .github/scripts/watchdog.sh | tar -x -C "$trusted" \
            || { echo "::warning::could not extract pr-lint.sh from origin/main"; exit 1; }
          rc=0
          for pr in $prs; do
            meta="$(gh api "repos/$OC_REPO/pulls/$pr")" || { echo "::warning::could not read PR #$pr"; rc=1; continue; }
            git fetch --no-tags origin "+refs/pull/$pr/head:refs/oc-lint/pr-$pr" \
              || { echo "::warning::could not fetch the head of PR #$pr"; rc=1; continue; }
            body="$RUNNER_TEMP/pr-lint-body-$pr.md"
            out="$RUNNER_TEMP/pr-lint-$pr.out"
            jq -r '.body // ""' <<< "$meta" > "$body"
            # pr-lint.sh の出力の行頭は PR のファイル名で、『::』で始まる名前は workflow command として runner に解釈される。
            # pr-lint.sh は OC_LINT_STRICT が 1 でないと違反ごとに『::warning::<ファイル名>...』を出すので、常に OC_LINT_STRICT=1 で
            # 走らせて (違反があれば終了 1。::warning:: は出ない)、job ログに流す行は全行に固定の接頭辞を付ける
            # (空白を除いた行頭が『::』なら command になる。空白の種類に依らず、全行を例外なく無効化する)。
            # 警告のみか strict かは、repo 変数 (この step の env の OC_LINT_STRICT) をここで見て決める。
            OC_LINT_STRICT=1 bash "$trusted/.github/scripts/pr-lint.sh" --base origin/main --head "refs/oc-lint/pr-$pr" \
              --body-file "$body" --title "$(jq -r '.title // ""' <<< "$meta")" 2>&1 \
              | tee "$out" | sed 's/^/pr-lint> /'
            r=${PIPESTATUS[0]}
            if [ "$r" -eq 1 ] && [ "${OC_LINT_STRICT:-}" != 1 ]; then
              echo "::warning::pr-lint found violations in PR #$pr (warn-only; see the step summary)"
              r=0
            fi
            [ "$r" -eq 0 ] || rc=$r
            # 出力の全行を字下げして載せる (字下げのコードブロックはファイル名の ``` で閉じられない)。
            {
              echo "### pr-lint (PR #$pr, implement)"
              echo
              sed 's/^/    /' "$out"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$rc"

  review:
    # レビュワーエージェント: PR opened / synchronize / reopened / ready_for_review で起動し、
    # approve/request-changes を出したうえで必要ならマージまで行う。
    #
    # fork PR ガード: pull_request イベントでは fork 由来の PR に secrets が渡らない
    # (OC_APP_PRIVATE_KEY 等が空)。App トークン生成は private-key が必須なので、
    # ガードが無いと fork PR は最初の token step で必ず失敗する。checkout が
    # head.ref を origin に要求するのも fork では成立しない。よって同一 repo の
    # PR だけを受ける (fork PR のレビューは人手)。
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: opencode-review-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      # PR のタイトル・本文・diff はすべて untrusted。式展開で run に埋め込まず、
      # $GITHUB_EVENT_PATH から jq で取り出してファイルに隔離する。

      # レビュワーは実装 App と別アイデンティティの方が approve できる
      # (同一 App は自分が作った PR を approve できない)。
      # reviewer App が未設定・失敗時は実装 App にフォールバックする。
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.OC_APP_CLIENT_ID }}
          private-key: ${{ secrets.OC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # review ジョブは base ref を checkout する。composite action
      # (./.github/actions/*) や scripts (.github/scripts/*) は必ず main の
      # 正本が使われ、PR 提供コードが secrets (App token / R2 認証情報 /
      # OC_AUTH_EXPORT) 付きで実行されることはない。
      # diff・タイトル・本文は gh pr diff / API で取得するため PR head の
      # 作業ツリーは不要。
      # トレードオフ: PR が .github/ を変更する場合、その変更はマージ後に
      # レビューで反映される (レビューは常に正本のスクリプトで走る)。
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      # prepare-event-context.sh は $GITHUB_EVENT_PATH を読むだけでリポジトリ
      # 内容を必要としないが、Checkout 後に置くことで .github/scripts/ 配下へ
      # アクセスできるようにする (review ジョブでも同様)。
      - name: Prepare PR context
        id: context
        shell: bash
        env:
          OC_PERMISSION: write
          # PR の現在の本文を API で取り直すため (push の直後に本文へ追記された oc_artifacts を拾う。#820)
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash .github/scripts/prepare-event-context.sh

      - uses: actions/create-github-app-token@v3
        id: reviewer-token
        continue-on-error: true
        if: ${{ vars.OC_REVIEW_APP_CLIENT_ID != '' }}
        with:
          client-id: ${{ vars.OC_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.OC_REVIEW_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # continue-on-error で飲み込んでいる失敗なので、原因が「installation の権限不足」
      # なのか「secret 未設定」なのかを明示する (Medium-1 / H7)。
      - name: Explain a missing reviewer token
        if: steps.reviewer-token.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::the reviewer App token could not be minted; gh will act as the implementer App"
          echo "::warning::likely cause: OC_REVIEW_APP_PRIVATE_KEY is unset, or the reviewer App installation does not grant contents:write / pull-requests:write"
          echo "::warning::the reviewer can still comment and merge, but cannot approve the implementer App's PR"

      - name: Configure git
        shell: bash
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REVIEWER_SLUG: ${{ steps.reviewer-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token || steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # reviewer App のトークンが取れていれば、そのアイデンティティに揃える。
          # 取れていない場合は実装 App の slug/email をそのまま使う。
          SLUG="${REVIEWER_SLUG:-$APP_SLUG}"
          USER_ID="$(gh api "/users/${SLUG}[bot]" --jq .id)"
          git config --global user.name "${SLUG}[bot]"
          git config --global user.email "${USER_ID}+${SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git

      # pr-lint.sh (CI-43): 差し戻しの上位原因 (REPORT 行数・repo 外パス・Closes/Refs と受入の整合・oc_artifacts の値域・
      # DOC_MAP 登録) を決定的に検査し、結果を step summary に書く。素材の取得 (Setup Agent Environment) の前に走らせる。
      # 既定は警告のみ: continue-on-error で job を落とさず、OC_LINT_STRICT は repo 変数 (未設定なら警告のまま)。
      # script は上で checkout 済みの base (main の正本)。PR head は refs/pull/N/head を fetch して diff の対象にするだけで、実行しない。
      - name: Lint the PR (pr-lint.sh)
        id: pr-lint
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token || steps.app-token.outputs.token }}
          OC_LINT_STRICT: ${{ vars.OC_LINT_STRICT }}
        run: |
          set -uo pipefail
          : "${OC_PR_NUMBER:?}" "${OC_PR_BODY_FILE:?}" "${OC_PR_TITLE_FILE:?}"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' "+refs/pull/${OC_PR_NUMBER}/head:refs/oc-lint/pr-${OC_PR_NUMBER}" \
            || { echo "::warning::could not fetch main and the PR head for pr-lint"; exit 1; }
          out="$RUNNER_TEMP/pr-lint.out"
          # pr-lint.sh の出力の行頭は PR のファイル名で、『::』で始まる名前は workflow command として runner に解釈される。
          # pr-lint.sh は OC_LINT_STRICT が 1 でないと違反ごとに『::warning::<ファイル名>...』を出すので、常に OC_LINT_STRICT=1 で
          # 走らせて (違反があれば終了 1。::warning:: は出ない)、job ログに流す行は全行に固定の接頭辞を付ける
          # (空白を除いた行頭が『::』なら command になる。空白の種類に依らず、全行を例外なく無効化する)。
          # 警告のみか strict かは、repo 変数 (この step の env の OC_LINT_STRICT) をここで見て決める。
          OC_LINT_STRICT=1 bash .github/scripts/pr-lint.sh --base origin/main --head "refs/oc-lint/pr-${OC_PR_NUMBER}" \
            --body-file "$OC_PR_BODY_FILE" --title "$(cat "$OC_PR_TITLE_FILE")" 2>&1 \
            | tee "$out" | sed 's/^/pr-lint> /'
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 1 ] && [ "${OC_LINT_STRICT:-}" != 1 ]; then
            echo "::warning::pr-lint found violations in PR #${OC_PR_NUMBER} (warn-only; see the step summary)"
            rc=0
          fi
          # 出力の全行を字下げして載せる (字下げのコードブロックはファイル名の ``` で閉じられない)。
          {
            echo "### pr-lint (PR #${OC_PR_NUMBER}, review)"
            echo
            sed 's/^/    /' "$out"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Setup Agent Environment
        uses: ./.github/actions/agent-setup
        with:
          # PR 本文の `oc_artifacts:` 行 (allowlist 検証済み)。素材を要する PR の e2e を独立再実行するため。
          # 空なら既定の fl-win64。
          artifacts: ${{ steps.context.outputs.artifacts || 'fl-win64' }}
          opencode-version: ${{ vars.OPENCODE_VERSION }}
          opencode-release-version: ${{ vars.OPENCODE_RELEASE_VERSION }}
          opencode-install-source: ${{ vars.OPENCODE_INSTALL_SOURCE }}
          cf-account-id: ${{ secrets.CF_ACCOUNT_ID }}
          cf-r2-access-key-id: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          cf-r2-secret-access-key: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}

      - name: Fetch PR diff
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -uo pipefail
          # PR 番号・repo 名は式展開で run に埋め込まず、前のステップが
          # $GITHUB_ENV に出した OC_PR_NUMBER / OC_REPO として読む。
          gh pr diff "$OC_PR_NUMBER" --repo "$OC_REPO" > "$RUNNER_TEMP/pr.diff" \
            || echo "::warning::could not fetch the diff for PR $OC_PR_NUMBER"
          echo "diff-lines=$(wc -l < "$RUNNER_TEMP/pr.diff")"

      - name: Assemble reviewer prompt
        id: prompt
        shell: bash
        env:
          OC_HAS_REVIEWER_TOKEN: ${{ steps.reviewer-token.outputs.token != '' }}
        run: bash .github/scripts/assemble-reviewer-prompt.sh

      # step に上限を置く: job の 60 分を使い切ると、下の verdict 検証 step が走る前に job ごと
      # 打ち切られうる。検証 (verdict が無ければ review を再起動) の時間を残す。
      - name: Run OpenCode (reviewer)
        timeout-minutes: 50
        uses: ./.github/actions/opencode
        with:
          model: ${{ vars.OC_MODEL_ID }}
          agent: build
          auth-export: ${{ secrets.OC_AUTH_EXPORT }}
          prompt-file: ${{ steps.prompt.outputs.prompt_file }}
        env:
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token || steps.app-token.outputs.token }}

      # reviewer が success で終わっても verdict を投稿しないことがある (PR #462)。そのままだと
      # 「レビューもされず修正もされない」PR になるので、verdict を検証し、無ければ review を再実行する。
      # !cancelled(): reviewer の step が失敗・タイムアウトした場合も再実行へ回す (cancel された run は再実行しない:
      # PM の停止手段を効かせる)。
      - name: Verify that a review verdict was posted
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token || steps.app-token.outputs.token }}
        run: bash .github/scripts/verify-review-verdict.sh

  # review job が runner の打ち切り (shutdown signal・実行時間超過) で cancelled になると、job 内の verify step は走らない
  # (CI-27 #1420: 同じ head で 7 回連続 cancelled、watchdog の 3 回再起動で oc:stuck)。新しい runner のこの job が、
  # watchdog を待たずに同じ head で review を再起動する (#1950)。
  # 上限: 再起動は verify-review-verdict.sh に委譲し、同じ head への再起動は review-retry マーカー 3 回まで
  # (watchdog と共有。超えたら PR に警告を残して止まる。無限ループにならない)。
  # PM の手動 cancel (gh run cancel) では再起動しない: job の annotation に runner 側の打ち切りの文言が無ければ何もしない。
  review-recover:
    needs: review
    if: ${{ always() && needs.review.result == 'cancelled' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GITHUB_TOKEN は run の job 一覧 (actions:read) と job の annotation (checks:read) にだけ使う。
    permissions:
      actions: read
      checks: read
    concurrency:
      group: opencode-review-recover-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.OC_APP_CLIENT_ID }}
          private-key: ${{ secrets.OC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # scripts は base の正本を使う (PR 提供コードを secrets 付きで実行しない)。
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Re-trigger the review when the runner cut it off
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUNS_TOKEN: ${{ github.token }}
          OC_REPO: ${{ github.repository }}
        run: bash .github/scripts/review-recover.sh

  # PM agent (oc-pm。#2330、親 #2319)。watchdog.sh か PM Worker が repository_dispatch (type oc-pm) で起こす。
  # payload は kind と ref だけ。値域の検証・対象 (issue/PR) の取得・fence での隔離は prepare-event-context.sh と
  # assemble-prompt.sh が行う (#2327)。この job は薄い配線だけを持つ。
  # 不変条件 (.github/prompts/pm.md の『不変条件』):
  #   - token は実装 App から permission-issues と permission-pull-requests の write だけを指定して発行する。
  #     permission-contents を指定しない (push・ブランチ作成・merge ができない)。GITHUB_TOKEN も workflow の
  #     permissions: {} のまま (job 単位で拡大しない)。
  #   - R2 の認証 (CF_*) を渡さない。agent-setup は artifacts: none・artifacts-required: false (R2 の認証が無い
  #     とき、既定の required だと agent-setup が失敗する)。
  #   - prepare-event-context.sh が dispatch_ok=false (= should_run=false) にした dispatch では agent を起動しない。
  #     その場合は job を失敗させる (送り手の誤りを緑の run で隠さない)。
  # 対象の取得に GH_TOKEN が要るため、token は Prepare event context より前に発行する (implement とは逆の順)。
  # 対象の起票者の確認 (許可 bot か OWNER/MEMBER/COLLABORATOR) もそのスクリプトが行う。
  pm:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'oc-pm'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: oc-pm-${{ github.event.client_payload.kind }}-${{ github.event.client_payload.ref }}
      cancel-in-progress: false
    env:
      # prepare-event-context.sh / assemble-prompt.sh が読む値 (read か write)。PM が書くのは issue/PR のコメント・
      # ラベル・本文だけで、contents は token が持たない (権限の実体は下の token の permission-*)。
      OC_PERMISSION: write
    steps:
      # 既定 ref (dispatch 時点の main) の scripts と prompt を使う。
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.OC_PM_APP_CLIENT_ID }}
          private-key: ${{ secrets.OC_PM_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      # untrusted な値は式展開で run に埋め込まない。payload は $GITHUB_EVENT_PATH から jq で読まれる。
      - name: Prepare event context
        id: context
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # PM App 起票の対象 (#5462): 未設定だと prepare-event-context.sh が
          # author=Bot の判定で PM App を許可せず dispatch を拒否する (#5466/#5468)。
          OC_PM_BOT_LOGIN: ${{ vars.OC_PM_BOT_LOGIN }}
        run: bash .github/scripts/prepare-event-context.sh

      - name: Refuse the dispatch
        if: steps.context.outputs.should_run != 'true'
        shell: bash
        run: |
          echo "::error::oc-pm: the agent was not started (see the messages of Prepare event context: kind or ref out of range, a target author that is not allowed, or an unreadable target)"
          exit 1

      - name: Setup Agent Environment
        if: steps.context.outputs.should_run == 'true'
        uses: ./.github/actions/agent-setup
        with:
          opencode-version: ${{ vars.OPENCODE_VERSION }}
          opencode-release-version: ${{ vars.OPENCODE_RELEASE_VERSION }}
          opencode-install-source: ${{ vars.OPENCODE_INSTALL_SOURCE }}
          artifacts: none
          artifacts-required: 'false'

      - name: Assemble prompt
        id: prompt
        if: steps.context.outputs.should_run == 'true'
        shell: bash
        run: bash .github/scripts/assemble-prompt.sh

      - name: Run OpenCode (PM agent)
        id: oc
        if: steps.context.outputs.should_run == 'true'
        uses: ./.github/actions/opencode
        with:
          model: ${{ vars.OC_MODEL_ID }}
          agent: build
          auth-export: ${{ secrets.OC_AUTH_EXPORT }}
          prompt-file: ${{ steps.prompt.outputs.prompt_file }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
