# 配置: PM が .github/workflows/pr-loop-tests.yml にコピーする。
#   (実装 App は workflows 権限が無く、.github/workflows/ への push は GitHub に拒否されるため)
#
# PR の loop (reviewer 差し戻し -> fix -> review、verdict 検証、reopen) の分岐テスト (#721)。
# fake gh で各スクリプトを検証する。secrets は使わず、GitHub API にも触れない。
name: pr-loop-tests
on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/actions/**'
      - '.github/workflows/opencode.yaml'
      - '.github/workflows/pr-loop-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run the PR loop tests
        run: bash .github/scripts/tests/test-pr-loop.sh
