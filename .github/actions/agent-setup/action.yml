name: Setup Agent Environment
description: Setup the agent environment for the workflow (toolchain + R2 artifacts)

inputs:
  r2-bucket:
    description: 'R2 bucket holding artifact bundles'
    required: false
    default: signature-studio-artifacts
  artifacts:
    description: 'Space-separated list of artifact prefixes (without .tar.zst) to download'
    required: false
    default: 'fl-win64'
  opencode-version:
    description: 'Pinned opencode CLI version for the npm channel (@opencode/cli-<target>). Empty = the default in .github/scripts/install-opencode.sh'
    required: false
  opencode-release-version:
    description: 'Pinned opencode release tag for the GitHub Releases channel (anomalyco/opencode). Empty = the default in .github/scripts/install-opencode.sh'
    required: false
  opencode-install-source:
    description: 'Where to install opencode from: auto (GitHub Releases, then npm, then the official installer), releases, or npm'
    required: false
  cf-account-id:
    description: 'Cloudflare account id for R2'
    required: false
  cf-r2-access-key-id:
    description: 'R2 access key id'
    required: false
  cf-r2-secret-access-key:
    description: 'R2 secret access key'
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@v10.3.0
    - name: Setup Python using uv
      shell: bash
      run: uv python install --default 3.14
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
    - name: Setup Node.js using pnpm
      shell: bash
      run: pnpm runtime set node 26.10.0
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
    - name: Setup OpenCode
      shell: bash
      env:
        OPENCODE_VERSION: ${{ inputs.opencode-version }}
        OPENCODE_RELEASE_VERSION: ${{ inputs.opencode-release-version }}
        OPENCODE_INSTALL_SOURCE: ${{ inputs.opencode-install-source }}
      run: bash .github/scripts/install-opencode.sh

    # install-opencode.sh は取得した版を `opencode --version` で検証済み。
    # ここでは「後続 step が PATH 経由で見つかる」ことだけを確認する。
    # ($GITHUB_PATH はこの step には効かないので、スクリプト内の検証はフルパスで行う)
    - name: Verify OpenCode on PATH
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v opencode >/dev/null 2>&1; then
          echo "::error::opencode is not on PATH for subsequent steps"
          exit 1
        fi
        echo "opencode: $(command -v opencode) -> $(opencode --version 2>&1)"

    # ---------------------------------------------------------------
    # R2 artifacts (未設定なら notice を出してスキップ)
    # ---------------------------------------------------------------
    - name: Download artifacts
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.cf-r2-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.cf-r2-secret-access-key }}
        AWS_DEFAULT_REGION: auto
        AWS_EC2_METADATA_DISABLED: 'true'
        R2_BUCKET: ${{ inputs.r2-bucket }}
        CF_ACCOUNT_ID: ${{ inputs.cf-account-id }}
        R2_ARTIFACTS: ${{ inputs.artifacts }}
      run: |
        set -uo pipefail
        if [ -z "$CF_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
          echo "::notice::R2 credentials not set; skipping artifact download"
          exit 0
        fi
        mkdir -p "$HOME/artifacts"
        endpoint="https://$CF_ACCOUNT_ID.r2.cloudflarestorage.com"
        for name in $R2_ARTIFACTS; do
          aws s3 cp "s3://$R2_BUCKET/artifacts/$name" "$HOME/artifacts" \
            --recursive --endpoint-url "$endpoint" --only-show-errors || true
        done
        [ -n "$(ls -A "$HOME/artifacts")" ] \
          || echo "::warning::no R2 artifacts available; the agent runs without the binaries"
        du -sh "$HOME/artifacts" 2>/dev/null || true
        {
          echo "ARTIFACTS_DIR=$HOME/artifacts"
          echo "TMPDIR=$RUNNER_TEMP"
        } >> "$GITHUB_ENV"
