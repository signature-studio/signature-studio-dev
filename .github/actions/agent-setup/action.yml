name: Setup Agent Environment
description: Setup the agent environment for the workflow (toolchain + R2 artifacts)

inputs:
  r2-bucket:
    description: 'R2 bucket holding artifact bundles'
    required: false
    default: signature-studio-artifacts
  artifacts:
    description: 'Space-separated list of artifact prefixes. Each is fetched as s3://<bucket>/artifacts/<prefix>.tar.zst'
    required: false
    default: 'fl-win64'
  artifacts-required:
    description: 'Fail the job when an artifact bundle is missing (true) or continue without it (false). Without the FL Studio / plugin binaries the agent cannot run e2e.'
    required: false
    default: 'true'
  opencode-version:
    description: 'Pinned opencode CLI version for the npm channel (@opencode/cli-<target>). Empty = the default in .github/scripts/install-opencode.sh'
    required: false
  opencode-release-version:
    description: 'Pinned opencode release tag for the GitHub Releases channel (anomalyco/opencode). Empty = the default in .github/scripts/install-opencode.sh'
    required: false
  opencode-install-source:
    description: 'Where to install opencode from: auto (npm, then GitHub Releases, then the official installer), releases, or npm'
    required: false
  cf-account-id:
    description: 'Cloudflare account id for R2'
    required: false
  cf-r2-access-key-id:
    description: 'R2 access key id'
    required: false
  cf-r2-secret-access-key:
    description: 'R2 secret access key'
    required: false

runs:
  using: "composite"
  steps:
    # uv / bun は PATH に載るため版を固定する (未指定だと実行ごとに最新が入る)。
    # 版を上げるときは下の `--version` の出力も確認する。
    - name: Setup uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        version: '0.13.1'
    - name: Show uv version
      shell: bash
      run: uv --version
    - name: Setup Python using uv
      shell: bash
      run: uv python install --default 3.14
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
    - name: Setup Node.js using pnpm
      shell: bash
      run: pnpm runtime set node 26.10.0
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.3'
    - name: Show Bun version
      shell: bash
      run: bun --version
    - name: Setup OpenCode
      shell: bash
      env:
        OPENCODE_VERSION: ${{ inputs.opencode-version }}
        OPENCODE_RELEASE_VERSION: ${{ inputs.opencode-release-version }}
        OPENCODE_INSTALL_SOURCE: ${{ inputs.opencode-install-source }}
      run: bash .github/scripts/install-opencode.sh

    # install-opencode.sh は取得した版を `opencode --version` で検証済み。
    # ここでは「後続 step が PATH 経由で見つかる」ことだけを確認する。
    # ($GITHUB_PATH はこの step には効かないので、スクリプト内の検証はフルパスで行う)
    - name: Verify OpenCode on PATH
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v opencode >/dev/null 2>&1; then
          echo "::error::opencode is not on PATH for subsequent steps"
          exit 1
        fi
        echo "opencode: $(command -v opencode) -> $(opencode --version 2>&1)"

    # ---------------------------------------------------------------
    # R2 artifacts (未設定なら notice を出してスキップ)
    # ---------------------------------------------------------------
    - name: Download artifacts
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.cf-r2-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.cf-r2-secret-access-key }}
        AWS_DEFAULT_REGION: auto
        AWS_EC2_METADATA_DISABLED: 'true'
        R2_BUCKET: ${{ inputs.r2-bucket }}
        CF_ACCOUNT_ID: ${{ inputs.cf-account-id }}
        R2_ARTIFACTS: ${{ inputs.artifacts }}
        R2_REQUIRED: ${{ inputs.artifacts-required }}
      run: |
        set -uo pipefail
        artifacts_dir="$HOME/artifacts"
        mkdir -p "$artifacts_dir"

        # 認証情報の確認は endpoint を組み立てる前に行う。${VAR:-} で読むのは、
        # 未設定時に set -u の生のシェルエラーを出す代わりに ::error:: へ
        # 案内できるようにするため。
        if [ -z "${CF_ACCOUNT_ID:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
          if [ "${R2_REQUIRED:-true}" = 'true' ]; then
            echo "::error::R2 credentials are missing but artifacts are required"
            echo "::error::set CF_ACCOUNT_ID / CF_R2_ACCESS_KEY_ID / CF_R2_SECRET_ACCESS_KEY, or pass artifacts-required=false when the task does not need the binaries"
            exit 1
          fi
          echo "::notice::R2 credentials not set and artifacts are optional; continuing without them"
          # 後続 step は $GITHUB_ENV の ARTIFACTS_DIR / TMPDIR を読むため、
          # happy path と同じ値を export してから抜ける。
          {
            echo "ARTIFACTS_DIR=$artifacts_dir"
            echo "TMPDIR=$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
          exit 0
        fi
        endpoint="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"

        # 命名は <prefix>.tar.zst で固定。--recursive の prefix 指定だと fl-win64 が
        # fl-win64-anything.tar.zst も拾うため、オブジェクトを明示して取得する。
        missing=""
        for name in ${R2_ARTIFACTS:-}; do
          # apt-* は R2 の素材ではない (後段で apt から入れる)
          case "$name" in apt-*) continue ;; esac
          key="artifacts/${name}.tar.zst"
          if aws s3 cp "s3://${R2_BUCKET}/$key" "$artifacts_dir" \
            --endpoint-url "$endpoint" --only-show-errors; then
            echo "fetched $key"
          else
            missing="$missing $key"
          fi
        done

        if [ -n "$missing" ]; then
          # 何がバケットに実在するかを一緒に出して、認証エラーと「空/命名違い」を
          # 切り分けられるようにする。
          echo "::error::missing R2 object(s) in s3://${R2_BUCKET}:$missing"
          echo "::error::objects actually present under artifacts/ (first 20):"
          aws s3 ls "s3://${R2_BUCKET}/artifacts/" --endpoint-url "$endpoint" 2>&1 | head -20 || true
          if [ "${R2_REQUIRED:-true}" = 'true' ]; then
            echo "::error::the agent cannot run e2e without these binaries; failing instead of continuing"
            exit 1
          fi
          echo "::warning::continuing without them because artifacts-required=false"
        fi

        # toolchain-* は /opt へ、work-* は repo 直下 (tools/<area>/work) へ展開する。
        # tarball 内の相対パスがそのまま配置先になる (retdec/・emsdk/・tools/<area>/work/)。
        # fl-win64 / plugins-* は agent が必要時に展開するのでここでは触らない。
        # 展開に失敗した素材は取得失敗と同じ扱い (required なら job を落とす)。
        extract_failed=""
        for f in "$artifacts_dir"/toolchain-*.tar.zst; do
          [ -e "$f" ] || continue
          # root で展開すると emsdk の cache (emcc が書き込む) が runner から書けず、
          # emcc が PermissionError で落ちる (#223 の run)。展開後に所有者を runner にする。
          if sudo tar --zstd -xf "$f" -C /opt && sudo chown -R "$(id -u):$(id -g)" "/opt/$(basename "$f" .tar.zst | sed 's/^toolchain-//')"; then
            echo "extracted $(basename "$f") -> /opt"
          else
            extract_failed="$extract_failed $(basename "$f")"
          fi
        done
        for f in "$artifacts_dir"/work-*.tar.zst; do
          [ -e "$f" ] || continue
          if tar --zstd -xf "$f" -C "$GITHUB_WORKSPACE"; then
            echo "extracted $(basename "$f") -> $GITHUB_WORKSPACE"
          else
            extract_failed="$extract_failed $(basename "$f")"
          fi
        done
        # work-* の中には /home/ubuntu/work/webstudio/... を指す絶対 symlink が含まれる
        # (作成元の VM のパス)。runner では dangling になるので、workspace 内を指すよう
        # 張り直す。対象は work-* を展開した範囲 (tools/*/work 以下) の symlink のみ。
        if ls "$artifacts_dir"/work-*.tar.zst >/dev/null 2>&1; then
          relinked=0
          relink_failed=0
          while IFS= read -r -d '' link; do
            target="$(readlink "$link")"
            case "$target" in
              /home/ubuntu/work/webstudio/*)
                if ln -sfn "$GITHUB_WORKSPACE/${target#/home/ubuntu/work/webstudio/}" "$link"; then
                  relinked=$((relinked + 1))
                else
                  echo "::warning::failed to relink $link"
                  relink_failed=$((relink_failed + 1))
                fi
                ;;
            esac
          done < <(find "$GITHUB_WORKSPACE/tools" -type l -path "$GITHUB_WORKSPACE/tools/*/work/*" -lname '/home/ubuntu/work/webstudio/*' -print0 2>/dev/null)
          echo "relinked $relinked absolute work symlinks -> $GITHUB_WORKSPACE (failed: $relink_failed)"
          if [ "$relink_failed" -gt 0 ]; then
            extract_failed="$extract_failed work-symlink-relink($relink_failed)"
          fi
        fi
        # analysis-* は ANALYSIS_DIR (tools/shared/env.sh の既定の親。#294) へ展開する。
        # tarball の先頭が plugins/... なので $ANALYSIS_DIR/plugins/... になる。
        analysis_dir="$HOME/analysis"
        for f in "$artifacts_dir"/analysis-*.tar.zst; do
          [ -e "$f" ] || continue
          mkdir -p "$analysis_dir"
          if tar --zstd -xf "$f" -C "$analysis_dir"; then
            echo "extracted $(basename "$f") -> $analysis_dir"
            echo "ANALYSIS_DIR=$analysis_dir" >> "$GITHUB_ENV"
          else
            extract_failed="$extract_failed $(basename "$f")"
          fi
        done
        if [ -n "$extract_failed" ]; then
          echo "::error::failed to extract:$extract_failed"
          if [ "${R2_REQUIRED:-true}" = 'true' ]; then
            exit 1
          fi
          echo "::warning::continuing without them because artifacts-required=false"
        fi

        # apt-mingw は R2 の素材ではなく apt パッケージ (mingw-w64: PE を作るテスト用)。
        # R2 から取得する対象 (上の for) には入れず、ここで要求された時だけ入れる。
        case " ${R2_ARTIFACTS:-} " in
          *" apt-mingw "*)
            if sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 >/dev/null 2>&1; then
              echo "installed gcc-mingw-w64-x86-64: $(command -v x86_64-w64-mingw32-gcc)"
            else
              echo "::error::failed to install gcc-mingw-w64-x86-64"
              [ "${R2_REQUIRED:-true}" = 'true' ] && exit 1
            fi
            ;;
        esac

        du -sh "$artifacts_dir" 2>/dev/null || true
        {
          echo "ARTIFACTS_DIR=$artifacts_dir"
          echo "TMPDIR=$RUNNER_TEMP"
        } >> "$GITHUB_ENV"
        # emsdk の upstream/bin の llvm-* (llvm-nm ほか) を ~/.local/bin に symlink する。
        # build.sh が `source /opt/emsdk/emsdk_env.sh` で PATH を作り直しても、~/.local/bin は
        # 残る (#223 の run: GITHUB_PATH への追加は emsdk_env.sh の後では効かなかった)。
        # upstream/bin を丸ごと PATH に入れないのは、runner の clang 等を隠さないため。
        if [ -d /opt/emsdk/upstream/bin ]; then
          mkdir -p "$HOME/.local/bin"
          for t in /opt/emsdk/upstream/bin/llvm-*; do
            ln -sf "$t" "$HOME/.local/bin/$(basename "$t")"
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi
    # p0c e2e 等の Python 依存 (#893)。runner の python3 は EXTERNALLY-MANAGED のため
    # システムへ pip install できない。専用 venv を作り、GITHUB_PATH で後続 step の
    # python3 / pip をその venv に向ける。
    - name: Install Python deps for tools (pefile / capstone / numpy)
      shell: bash
      run: |
        set -euo pipefail
        venv="$HOME/.local/agent-py"
        uv venv --clear --python 3.14 "$venv"
        uv pip install --python "$venv/bin/python" pefile capstone numpy
        "$venv/bin/python" -c "import pefile, capstone, numpy; print('pefile', pefile.__version__, 'capstone', capstone.__version__, 'numpy', numpy.__version__)"
        echo "$venv/bin" >> "$GITHUB_PATH"
