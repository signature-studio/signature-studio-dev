name: Setup Agent Environment
description: Setup the agent environment for the workflow (toolchain + R2 artifacts + token refresh)

inputs:
  r2-bucket:
    description: 'R2 bucket holding artifact bundles'
    required: false
    default: signature-studio-artifacts
  artifacts:
    description: 'Space-separated list of artifact prefixes (without .tar.zst) to download'
    required: false
    default: 'fl-win64'
  app-id:
    description: 'GitHub App id (client id) used for token auto-refresh. Pass via workflow: vars.OC_APP_CLIENT_ID'
    required: false
  app-private-key:
    description: 'GitHub App private key (PEM) for token auto-refresh. Pass via workflow: secrets.OC_APP_PRIVATE_KEY (composite actions cannot read the secrets context directly)'
    required: false
  token-permissions:
    description: 'JSON fragment limiting the refreshed token permissions, e.g. {"contents":"read"}. Empty = installation defaults.'
    required: false
  cf-account-id:
    description: 'Cloudflare account id for R2'
    required: false
  cf-r2-access-key-id:
    description: 'R2 access key id'
    required: false
  cf-r2-secret-access-key:
    description: 'R2 secret access key'
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup uv
      uses: astral-sh/setup-uv@v10.3.0
    - name: Setup Python using uv
      shell: bash
      run: uv python install --default 3.14
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
    - name: Setup Node.js using pnpm
      shell: bash
      run: pnpm runtime set node 26.10.0
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
    - name: Setup OpenCode
      shell: bash
      run: bash .github/scripts/install-opencode.sh

    # ---------------------------------------------------------------
    # GitHub App token auto-refresh (App token は 1 時間で切れる)
    # 発行スクリプトと unit は .github/scripts・.github/systemd のファイルをそのまま置く。
    # git は credential helper で $RUNNER_TEMP/gh_token を都度読むので、ジョブ途中の
    # push でも常に有効なトークンが使われる。
    # ---------------------------------------------------------------
    - name: Install token refresh
      if: ${{ inputs.app-id != '' && inputs.app-private-key != '' }}
      shell: bash
      env:
        OC_APP_ID: ${{ inputs.app-id }}
        OC_APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
        OC_TOKEN_PERMISSIONS: ${{ inputs.token-permissions }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.local/bin" "$HOME/.config/systemd/user"
        cp .github/scripts/mint-token.sh "$HOME/.local/bin/"
        cp .github/systemd/token-refresh.service \
           .github/systemd/token-refresh.timer "$HOME/.config/systemd/user/"
        printf '%s\n' "$OC_APP_PRIVATE_KEY" > "$HOME/.config/token-refresh.pem"
        {
          echo "OC_APP_ID=$OC_APP_ID"
          echo "OC_APP_PRIVATE_KEY_FILE=$HOME/.config/token-refresh.pem"
          echo "TOKEN_FILE=$RUNNER_TEMP/gh_token"
          [ -z "$OC_TOKEN_PERMISSIONS" ] || echo "OC_TOKEN_PERMISSIONS='$OC_TOKEN_PERMISSIONS'"
        } > "$HOME/.config/token-refresh.env"
        chmod 600 "$HOME/.config/token-refresh.env" "$HOME/.config/token-refresh.pem"
        # 単一引用符なので $( ) は helper 実行時に展開される
        helper='!f() { echo username=x-access-token; echo password=$(cat "$RUNNER_TEMP/gh_token" 2>/dev/null); }; f'
        git config --global --replace-all credential.helper "$helper"
        # gh auth setup-git は URL 限定 helper を設定するので、それも上書きする
        git config --global --replace-all credential.https://github.com.helper "$helper"
        systemctl --user daemon-reload && systemctl --user enable --now token-refresh.timer \
          && echo "token refresh timer enabled" \
          || echo "::warning::systemctl --user unavailable on this runner; the token is not refreshed during this job"
        . "$HOME/.config/token-refresh.env"
        "$HOME/.local/bin/mint-token.sh"

    # ---------------------------------------------------------------
    # R2 artifacts (未設定なら notice を出してスキップ)
    # ---------------------------------------------------------------
    - name: Download artifacts
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.cf-r2-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.cf-r2-secret-access-key }}
        AWS_DEFAULT_REGION: auto
        AWS_EC2_METADATA_DISABLED: 'true'
        R2_BUCKET: ${{ inputs.r2-bucket }}
        CF_ACCOUNT_ID: ${{ inputs.cf-account-id }}
        R2_ARTIFACTS: ${{ inputs.artifacts }}
      run: |
        set -uo pipefail
        if [ -z "$CF_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
          echo "::notice::R2 credentials not set; skipping artifact download"
          exit 0
        fi
        mkdir -p "$HOME/artifacts"
        endpoint="https://$CF_ACCOUNT_ID.r2.cloudflarestorage.com"
        for name in $R2_ARTIFACTS; do
          aws s3 cp "s3://$R2_BUCKET/artifacts/$name" "$HOME/artifacts" \
            --recursive --endpoint-url "$endpoint" --only-show-errors || true
        done
        [ -n "$(ls -A "$HOME/artifacts")" ] \
          || echo "::warning::no R2 artifacts available; the agent runs without the binaries"
        du -sh "$HOME/artifacts" 2>/dev/null || true
        {
          echo "ARTIFACTS_DIR=$HOME/artifacts"
          echo "TMPDIR=$RUNNER_TEMP"
        } >> "$GITHUB_ENV"
