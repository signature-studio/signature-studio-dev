name: OpenCode
description: 'Run OpenCode tasks based on a prompt file; summary goes to $GITHUB_STEP_SUMMARY and the job log'

inputs:
  model:
    description: 'the model to use for OpenCode'
    required: true
  prompt-file:
    description: 'Path to a file holding the prompt. A path is used instead of the prompt text so that a multi-line prompt never has to travel through a step input or a heredoc delimiter.'
    required: true
  agent:
    description: 'the opencode agent to run'
    required: false
    default: build
  auth-export:
    description: 'JSON exported by `opencode auth export` (OpenCode Console credentials)'
    required: false

runs:
  using: "composite"
  steps:
    - name: Import OpenCode credentials
      if: ${{ inputs.auth-export != '' }}
      shell: bash
      env:
        OC_AUTH_EXPORT: ${{ inputs.auth-export }}
      run: |
        set -euo pipefail
        printf '%s' "$OC_AUTH_EXPORT" | opencode auth import
        opencode auth list

    # prompt は env 経由で渡す (run スクリプト中に直接展開すると $( ) として
    # 評価されてしまう)。プロンプト本文はファイルから読む。
    # リトライは指数バックオフ入り: 直ちに再試行してもプロバイダ側の 429/5xx が
    # 回復しない限り無駄で、コストだけ二重になる。
    - name: Run OpenCode
      id: run
      shell: bash
      env:
        OC_PROMPT_FILE: ${{ inputs.prompt-file }}
        OC_MODEL: ${{ inputs.model }}
        OC_AGENT: ${{ inputs.agent }}
      run: |
        # GitHub の `shell: bash` は -e 付きで起動される。-e のままだと opencode が非 0 で
        # 終わった時点で step が即死し、rc の記録・リトライ・stderr の出力が全て走らない。
        set +e
        set -uo pipefail
        if [ ! -r "$OC_PROMPT_FILE" ]; then
          echo "::error::prompt file is not readable: $OC_PROMPT_FILE"
          exit 1
        fi
        # runner の状態を 60 秒おきに step のログへ出す (#765)。fix run が実装 step の途中で
        # 'The runner has received a shutdown signal' (exit 143) で打ち切られることがあり、そのときは
        # 後続の always() step も走らず、打ち切り直前の状態が残らない。標準出力へ直接出せば、
        # step が落ちてもログに残る。プロセスは comm (コマンド名のみ) を出し、引数は出さない。
        # 平常は OC_SAMPLE_SECS (既定 60 秒) おき。mem 使用率 70% 超か上位プロセスの RSS 4GB 超のときは
        # 5 秒おきにし、[sys][WARN] を出す (CI-177。clang は 11〜36 秒で 10GB を超えるため 60 秒では間に合わない)。
        sys_sampler() {
          local used total top_kb top_comm top_mb secs
          while :; do
            read -r used total <<< "$(free -m | awk '/^Mem:/{print $3, $2}')"
            read -r top_kb top_comm <<< "$(ps -eo rss=,comm= --sort=-rss | head -1)"
            top_mb=$(( ${top_kb:-0} / 1024 ))
            secs="${OC_SAMPLE_SECS:-60}"
            echo "[sys] $(date -u +%H:%M:%S) mem=$(free -m | awk '/^Mem:/{printf "%d/%dMB", $3, $2}') swap=$(free -m | awk '/^Swap:/{printf "%dMB", $3}') disk=$(df --output=pcent / | tail -1 | tr -d ' ') load=$(cut -d' ' -f1-3 /proc/loadavg)"
            ps -eo rss=,etimes=,comm= --sort=-rss | head -3 | awk '{printf "[sys]   rss=%dMB up=%ds %s\n", $1 / 1024, $2, $3}'
            if [ "$(( ${total:-1} > 0 ? used * 100 / total : 0 ))" -gt 70 ] || [ "$top_mb" -gt 4096 ]; then
              echo "[sys][WARN] mem=${used}/${total}MB top=${top_comm} rss=${top_mb}MB"
              secs=5
            fi
            timeout "$secs" tail -f /dev/null
          done
        }
        stop_sampler() {
          [ -n "${sampler_pid:-}" ] || return 0
          pkill -P "$sampler_pid" 2>/dev/null
          kill "$sampler_pid" 2>/dev/null
          wait "$sampler_pid" 2>/dev/null
          sampler_pid=
        }
        sys_sampler &
        sampler_pid=$!
        trap stop_sampler EXIT

        # メモリ上限 (CI-177): opencode のプロセス木を cgroup v2 の scope に入れ、RAM の 85% を超えた
        # 子プロセス (clang など) だけを kill する。OOMPolicy=continue で scope 全体は止めず、step は続く。
        # sudo が使えない・cgroup の scope を作れない runner では上限を付けず、従来どおり起動する (失敗にしない)。
        # sudo -E は PATH を secure_path に戻すため、PATH は env で渡す。opencode は絶対パスで起動する。
        oc_bin="$(command -v opencode)"
        mem_cap_mb="${OC_MEM_CAP_MB:-$(( $(awk '/^MemTotal:/{print $2}' /proc/meminfo) / 1024 * 85 / 100 ))}"
        mem_wrap=()
        if sudo -n systemd-run --scope --quiet -p "MemoryMax=${mem_cap_mb}M" -p MemorySwapMax=0 \
             -p OOMPolicy=continue -- true >/dev/null 2>&1; then
          mem_wrap=(sudo -n -E systemd-run --scope --quiet -p "MemoryMax=${mem_cap_mb}M" -p MemorySwapMax=0
            -p OOMPolicy=continue --uid "$(id -u)" --gid "$(id -g)" --)
          echo "opencode memory cap: ${mem_cap_mb}MB (cgroup scope)"
        else
          echo "::notice::cgroup scope unavailable; running opencode without a memory cap"
        fi

        rc=1
        attempt=1
        wait_s=15
        while [ "$attempt" -le 2 ]; do
          # プロンプトは引数でなく標準入力で渡す。Linux は 1 引数を 128KB (131072 バイト) に制限し、
          # 日本語の diff を含む review のプロンプトはそれを超える ("Argument list too long"、終了コード 126)。
          # 再試行のたびにファイルを開き直す。
          # setsid -w: opencode を別セッションで起動する。エージェントが後始末で `kill 0` や
          # `kill -- -PGID` を実行しても、この step の bash に SIGTERM が届かない (届くと exit 143 で
          # step が落ち、rc の記録・リトライ・後続の診断 step が全て走らない。#744)。
          setsid -w "${mem_wrap[@]}" env PATH="$PATH" "$oc_bin" run --standalone --auto \
            --model "$OC_MODEL" --agent "$OC_AGENT" \
            --format json --print-logs \
            < "$OC_PROMPT_FILE" \
            > "$RUNNER_TEMP/oc-output.jsonl" 2> "$RUNNER_TEMP/oc-stderr.log"
          rc=$?
          if [ "$rc" = 0 ]; then break; fi
          echo "::warning::opencode run failed (attempt $attempt/2, exit $rc)"
          if [ "$attempt" -lt 2 ]; then
            echo "waiting ${wait_s}s before retrying"
            sleep "$wait_s"
            wait_s=$((wait_s * 2))
          fi
          attempt=$((attempt + 1))
        done
        stop_sampler

        # sid 抽出: 旧実装は `jq ... | head -1` で、head が先に閉じると jq が
        # SIGPIPE で死に、step の shell は -o pipefail なので step 全体が落ちていた。
        # また 1 行でも不正 JSON があると jq 全体が失敗する。
        # ここでは行を raw で読み、不正行は fromjson? で黙って捨て、
        # sed -n '1p' (早期 close しない) で先頭 1 件を取る。
        sid="$(jq -Rr 'fromjson? | .sessionID? | select(. != null)' \
          "$RUNNER_TEMP/oc-output.jsonl" 2>/dev/null | sed -n '1p')"

        {
          printf 'rc=%s\n' "$rc"
          printf 'sid=%s\n' "$sid"
        } >> "$GITHUB_OUTPUT"
        echo "opencode exit code: $rc"
        echo "opencode session: ${sid:-none}"

    # 作業の記録は `opencode run --format json` の JSONL をそのまま使う。
    # 旧実装は「最後の assistant メッセージ」だけを API から取っていたため、最後がツール呼び出し前の
    # 前置き 1 行だと作業内容が何も残らなかった (run 38331256919 / 38331111477)。
    # JSONL は run 中の全イベント (text / tool_use / step_finish) を持ち、session が消えても読める。
    # 生の JSONL は出さない (public repo のログは公開。tool の入出力に認証情報や FL 由来物が
    # 含まれ得て、secret マスクは登録値との完全一致でしか効かない。レビュー指摘 #477)。
    # allowlist の投影だけを出す: text は全文、tool_use は tool / status / 所要 ms / 入力の
    # description・先頭 200 文字 (出力 state.output は出さない)、step_finish は cost / tokens。
    # 出力は jq の @json で 1 行に収め、`::` 始まりの workflow command として解釈されない。
    - name: Dump OpenCode events
      if: ${{ always() }}
      shell: bash
      run: |
        set +e
        f="$RUNNER_TEMP/oc-output.jsonl"
        [ -s "$f" ] || { echo "no opencode output at $f"; exit 0; }
        echo "::group::opencode events (allowlisted fields only; tool output is not logged)"
        jq -Rr 'fromjson? | select(.type != null)
          | if .type == "text" then "text \(.part.text | gsub("\n"; " ") | .[0:2000] | @json)"
            elif .type == "tool_use" then
              "tool \(.part.tool) status=\(.part.state.status) ms=\(((.part.state.time.end // 0) - (.part.state.time.start // 0))) input=\(((.part.state.input.description // .part.state.input.command // .part.state.input.filePath // .part.state.input.pattern // "") | tostring | .[0:200]) | @json)"
            elif .type == "step_finish" then "step_finish cost=\(.part.cost // 0) tokens=\(.part.tokens | tojson)"
            else empty end' "$f"
        echo "::endgroup::"

    # step summary には assistant の text ブロックを全て順に出す (最後の 1 件だけにしない)。
    - name: Write step summary
      if: ${{ always() }}
      shell: bash
      run: |
        set +e
        f="$RUNNER_TEMP/oc-output.jsonl"
        [ -s "$f" ] || exit 0
        {
          echo "## OpenCode result"
          echo
          # `::` 始まりの行は tee で stdout に流れると workflow command と解釈されるため、
          # 全行の先頭に空白を足す。
          jq -Rr 'fromjson? | select(.type == "text") | .part.text // empty | split("\n")[] | " " + .' "$f"
          echo
          echo "### usage"
          jq -Rrs '[split("\n")[] | fromjson? | select(.type == "step_finish") | .part]
            | "steps=\(length) cost=\((map(.cost // 0) | add // 0) * 1000000 | round / 1000000)"' "$f"
        } | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Fail if OpenCode did not succeed
      if: ${{ steps.run.outputs.rc != '0' }}
      shell: bash
      env:
        RC: ${{ steps.run.outputs.rc }}
      run: |
        echo "::error::opencode run exited with code $RC"
        echo "--- opencode stderr (tail) ---"
        tail -c 8000 "$RUNNER_TEMP/oc-stderr.log" 2>/dev/null
        exit 1