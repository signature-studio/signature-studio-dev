<!doctype html><meta charset="utf-8"><title>p8 real</title>
<script>
let w = null;
window.runReal = (msg) => new Promise((res, rej) => {
  if (w) w.terminate();
  w = new Worker('/l/web/real_worker.mjs', { type: 'module' });
  w.onmessage = (ev) => (ev.data.ok ? res(ev.data.r) : rej(new Error(ev.data.error)));
  w.onerror = (e) => rej(new Error('worker error ' + e.message));
  w.postMessage(msg);
});
</script>
