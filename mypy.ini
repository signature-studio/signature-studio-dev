# mypy 設定 — 変換ロジックの型契約を段階的に厳格化する (CI-194, 親 #2319)。
#
# Tier 1 (files に列挙した 12 モジュール) を strict で検査し, CI
# (.github/workflows/typecheck.yaml) で blocking にする。Tier 2 (残りの変換コア:
# p1/base などの大物と x64c.py 系) は未 strict の baseline で, 拡大は別 issue。
# モジュール別のエラー数の測定値は issue/PR 本文を参照 (このファイルには書かない)。
#
# 実行 (repo ルート): `mypy --config-file mypy.ini`
# ローカル導入: python3 -m venv /tmp/v && /tmp/v/bin/pip install mypy==2.4.0
#
# 設計メモ (なぜ per-module [mypy-liftlib.*] でなく files + follow_imports か):
#   mypy は [mypy-X] のオプションを「X と, X が (推移的に) import するモジュール」にまで
#   適用する (mypy 2.4.0 で実測: [mypy-liftlib.lb_layout] strict=True だけで他の 13 ファイルが
#   strict 検査された)。そのため blocking の範囲は「files に列挙したモジュール」で定め,
#   strict は全体に掛けつつ, follow_imports = silent で列挙外のモジュールのエラーを
#   報告しない (契約は見える: 列挙モジュールからの呼び出しは相手が untyped なら no-untyped-call で止まる)。

[mypy]
python_version = 3.12
# 外部ライブラリ (pefile / capstone 等) の stub が無く, sys.path 経由の動的 import もあるため。
# 検査の目的は変換コア内部の interface (シグネチャ・戻り値) なので未解決 import は Any とする。
ignore_missing_imports = True
mypy_path = tools/liftlib, tools/shared
follow_imports = silent
strict = True
warn_unused_configs = True

# Tier 1: この列挙が blocking の範囲 (追加は別 issue = Tier 2 からの昇格)。
files =
    tools/liftlib/liftlib/env.py,
    tools/liftlib/liftlib/diag.py,
    tools/liftlib/liftlib/ir.py,
    tools/liftlib/liftlib/lb_layout.py,
    tools/liftlib/liftlib/pe.py,
    tools/liftlib/liftlib/runtime_lb.py,
    tools/liftlib/liftlib/passes/boolret.py,
    tools/liftlib/liftlib/passes/dataimage.py,
    tools/liftlib/liftlib/passes/fp_bind.py,
    tools/liftlib/liftlib/passes/icall.py,
    tools/liftlib/liftlib/passes/l1_restore.py,
    tools/liftlib/liftlib/passes/remap.py
